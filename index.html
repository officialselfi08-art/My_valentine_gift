<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <style>
        body { background-color: #ffebee; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: inline-block; width: 80%; }
        h1 { color: #e91e63; }
        .heart { font-size: 100px; color: red; animation: beat 1s infinite; }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .msg { font-size: 18px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Happy Valentine's Day!</h1>
        <p class="msg">Aapke liye ek special wish...</p>
    </div>
</body>
</html>
